worker_processes ${{num_workers}};
error_log stderr notice;
daemon off;
pid logs/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  # Compiled Teal is in build/. views/ is still loaded from the project root
  lua_package_path "./build/?.lua;./build/?/init.lua;./?.lua;./?/init.lua;/usr/local/share/lua/5.1/?.lua;/usr/local/share/lua/5.1/?/init.lua;;";
  lua_package_cpath "./?.so;/usr/local/lib/lua/5.1/?.so;;";

  init_by_lua_block {
    require "lpeg"
  }

  server {
    listen ${{port}};
    lua_code_cache ${{code_cache}};

    location / {
      default_type text/html;
      content_by_lua_block {
        require("lapis").serve("app")
      }
    }

    location /static/ {
      alias static/;
    }

    location /favicon.ico {
      alias static/favicon.ico;
    }
  }
}
